<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para el amor de mi vida</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="falling-hearts-container"></div>

    <main class="card">
        <div class="content-wrapper">
            <div class="text-section">
                <p class="greeting">Para el amor de mi vida:</p>
                <br>
                <p class="message">Si pudiera elegir un lugar<br>seguro, sería a tu lado.</p>
                <br>
                <p class="message">Cuanto más tiempo estoy<br>contigo más te amo.</p>
                <p class="signature">— I Love You!</p>
            </div>

            <div class="tree-section">
                <div class="tree-container">
                    <div id="tree-leaves"></div>
                    <div class="tree-trunk"></div>
                </div>
            </div>
        </div>

        <div class="footer-section">
            <p class="counter-title">Mi amor por ti comenzó hace...</p>
            <div class="counter-container">
                <span class="number" id="days">0</span> <span class="label">días</span>
                <span class="number" id="hours">0</span> <span class="label">horas</span>
                <span class="number" id="minutes">0</span> <span class="label">minutos</span>
                <span class="number" id="seconds">0</span> <span class="label">segundos</span>
            </div>
        </div>
        <div class="ground-line"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
