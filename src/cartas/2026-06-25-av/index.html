<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para el amor de mi vida</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="falling-hearts-container"></div>

    <main class="card">
        <div class="content-wrapper">
            <div class="text-section">
                <p class="greeting fade-in delay-1">Para el amor de mi vida:</p>
                <br>
                <p class="message fade-in delay-2">Si pudiera elegir un lugar<br>seguro, sería a tu lado.</p>
                <br>
                <p class="message fade-in delay-3">Cuanto más tiempo estoy<br>contigo más te amo.</p>
                <p class="signature fade-in delay-4">— I Love You!</p>
            </div>

            <div class="tree-section fade-in delay-2">
                <div class="tree-container">
                    
                    <div class="tree-trunk-container">
                        <svg viewBox="0 0 200 300" class="organic-trunk">
                            <defs>
                                <linearGradient id="trunkGradient" x1="0" y1="0" x2="1" y2="0">
                                    <stop offset="0%" stop-color="#3a2214" />
                                    <stop offset="40%" stop-color="#54331c" />
                                    <stop offset="70%" stop-color="#704528" />
                                    <stop offset="100%" stop-color="#26150b" />
                                </linearGradient>
                            </defs>
                            <path d="M75,300 
                                     C82,250 86,200 82,160 
                                     C78,130 64,105 50,80 
                                     C46,72 53,68 59,75 
                                     C72,90 86,118 92,136 
                                     C94,112 92,80 86,40 
                                     C84,30 94,28 97,38 
                                     C103,70 105,108 105,126 
                                     C110,102 124,74 142,50 
                                     C148,42 156,46 152,55 
                                     C138,82 122,115 116,144 
                                     C112,176 115,224 125,300 
                                     C108,303 92,303 75,300 Z" 
                                  fill="url(#trunkGradient)" />
                            <path d="M83,155 C73,128 57,110 42,96 C38,92 43,87 48,91 C62,104 76,122 84,140 Z" fill="#3a2214" opacity="0.8"/>
                            <path d="M113,162 C124,138 142,120 160,106 C164,102 168,107 164,112 C148,125 132,144 120,168 Z" fill="#26150b" opacity="0.7"/>
                            <path d="M75,300 C64,302 50,305 40,310 C37,311 39,315 44,313 C54,309 66,305 73,302 Z" fill="#3a2214"/>
                            <path d="M125,300 C134,302 148,305 158,311 C161,312 163,308 159,306 C150,303 137,301 127,300 Z" fill="#26150b"/>
                        </svg>
                    </div>

                    <div id="tree-leaves"></div>

                </div>
            </div>
        </div>

        <div class="footer-section fade-in delay-5">
            <p class="counter-title">Mi amor por ti comenzó hace...</p>
            <div class="counter-container">
                <span class="number" id="days">0</span> <span class="label">días</span>
                <span class="number" id="hours">0</span> <span class="label">horas</span>
                <span class="number" id="minutes">0</span> <span class="label">minutos</span>
                <span class="number" id="seconds">0</span> <span class="label">segundos</span>
            </div>
        </div>
        <div class="ground-line"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
