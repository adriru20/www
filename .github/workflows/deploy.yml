name: Deploy to IONOS

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Comprobar sintaxis PHP
        run: |
          find . -name '*.php' -not -path './apps/wiki/vault/*' -print0 \
            | xargs -0 -n1 php -l > /dev/null

  deploy:
    needs: lint
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # Clave del servidor SFTP: guarda en el secret SFTP_KNOWN_HOST la línea de
      # known_hosts (ssh-keyscan -t ed25519 <host>) verificada la primera vez a mano.
      - name: Configurar verificación de clave del servidor
        env:
          KNOWN_HOST: ${{ secrets.SFTP_KNOWN_HOST }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$KNOWN_HOST" ]; then
            echo "$KNOWN_HOST" > ~/.ssh/known_hosts
            echo "SFTP_STRICT=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secret SFTP_KNOWN_HOST: se acepta cualquier clave del servidor (inseguro)."
            echo "SFTP_STRICT=no" >> "$GITHUB_ENV"
          fi

      # Fichero público con la versión desplegada: https://www.adriru.es/version.txt
      - name: Generar version.txt
        run: |
          printf 'commit: %s\ndesplegado: %s\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%d %H:%M:%S UTC')" > version.txt

      # La contraseña se escapa y va en un fichero de órdenes (lftp -f) en vez de en la línea
      # de comandos: así admite cualquier carácter (" \\ $ # %) y no sale nunca en el log.
      - name: Sincronizar vía SFTP
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          # No se usa --delete a propósito: en el servidor viven ficheros que no están en Git
          # (db.local.php, imágenes subidas, backups, logs).
          ESC_USER=$(printf '%s' "$FTP_USER" | sed 's/[\\"]/\\&/g')
          ESC_PASS=$(printf '%s' "$FTP_PASS" | sed 's/[\\"]/\\&/g')
          {
            if [ "$SFTP_STRICT" = "no" ]; then
              echo "set sftp:auto-confirm yes"
            else
              echo 'set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes"'
            fi
            echo "open sftp://$FTP_HOST"
            echo "user \"$ESC_USER\" \"$ESC_PASS\""
            echo "mirror -R -v --exclude .git/ --exclude .github/ --exclude .vscode/ --exclude apps/wiki/vault/.obsidian/ --exclude backend/logs/ --exclude apps/inventario/backup/ --exclude README.md --exclude .gitignore ./ /www/"
            echo "cls -l /www/version.txt"
            echo "cls -l /www/apps/giftlist/lib.php"
            echo "cls -l /www/"
            echo "bye"
          } > "$RUNNER_TEMP/lftp.cmd"
          chmod 600 "$RUNNER_TEMP/lftp.cmd"
          lftp -f "$RUNNER_TEMP/lftp.cmd"
          rm -f "$RUNNER_TEMP/lftp.cmd"
